name: news_app
description: تطبيق أخبار المنطقة — النشر للإدارة، والتفاعل للجميع. KM2 Development
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.3
  http: ^1.2.2

  google_sign_in: ^6.2.2
  video_player: ^2.9.2
  video_compress: ^3.1.4
  url_launcher: ^6.3.1

  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # اختياري: خط عربي أجمل. ضع ملفات Cairo داخل assets/fonts ثم أزل التعليق.
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Cairo-ExtraBold.ttf
  #         weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#0B63CE"